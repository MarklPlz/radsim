<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radsim</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
    <div class="frame">
        <div class="tracks"></div>
        <div class="countinghead1">
            <div class="circle left"></div>
            <div class="circle right"></div>
            <div class="line"></div>
            <a href="/ch1/l" class="triangle left"></a>
            <a href="/ch1/r" class="triangle right"></a>
        </div>
        <div class="countinghead2">
            <div class="circle left"></div>
            <div class="circle right"></div>
            <div class="line"></div>
            <a href="/ch2/l" class="triangle left"></a>
            <a href="/ch2/r" class="triangle right"></a>
        </div>
        <div class="countinghead3">
            <div class="circle left"></div>
            <div class="circle right"></div>
            <div class="line"></div>
            <a href="/ch3/l" class="triangle left"></a>
            <a href="/ch3/r" class="triangle right"></a>
        </div>
        <div class="countinghead4">
            <div class="circle left"></div>
            <div class="circle right"></div>
            <div class="line"></div>
            <a href="/ch4/l" class="triangle left"></a>
            <a href="/ch4/r" class="triangle right"></a>
        </div>
        <div class="train">
            <div class="carriage"></div>
            <div class="carriage"></div>
            <div class="carriage"></div>
        </div>
    </div>
    <div class="buttoncontainer">
        <a href="/train/r" class="button">Überfahrt Rechts</a>
    </div>
    <div class="buttoncontainer">
        <a href="/train/l" class="button">Überfahrt Links</a>
    </div>
</body>

</html>
